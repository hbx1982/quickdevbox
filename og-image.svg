<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Glow Orbs -->
  <circle cx="200" cy="150" r="250" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1000" cy="480" r="280" fill="#818cf8" opacity="0.08"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 140)">
    <rect width="70" height="70" rx="18" fill="url(#primaryGrad)"/>
    <path d="M 40 15 L 20 40 L 34 40 L 28 60 L 52 32 L 36 32 Z" fill="#090d16"/>
  </g>

  <text x="190" y="190" font-family="Inter, sans-serif" font-size="44" font-weight="800" fill="#ffffff">QuickDevBox<tspan fill="#38bdf8">.com</tspan></text>

  <!-- Hero Content -->
  <text x="100" y="320" font-family="Inter, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Ultra-Fast Developer Tools.</text>
  <text x="100" y="385" font-family="Inter, sans-serif" font-size="52" font-weight="800" fill="#38bdf8">Zero Data Tracking.</text>

  <text x="100" y="450" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">30+ Free, 100% Client-Side Web Utilities Engine for Software Developers.</text>

  <!-- Badges -->
  <g transform="translate(100, 495)">
    <rect width="230" height="42" rx="21" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
    <text x="25" y="26" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#38bdf8">🔒 100% Local Engine</text>

    <rect x="250" width="220" height="42" rx="21" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
    <text x="275" y="26" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#38bdf8">⚡ Sub-Millisecond</text>

    <rect x="490" width="230" height="42" rx="21" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)"/>
    <text x="515" y="26" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#38bdf8">🚫 Zero Data Retention</text>
  </g>
</svg>
